[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dblift"
version = "4.10.0"
description = "Flyway-style raw-SQL migrations for Python teams. No JVM, and you see the exact SQL before it runs."
keywords = ["flyway", "migrations", "python", "sql", "postgresql", "mysql"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["dblift-core[analysis,presentation]==4.10.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
dblift = "dblift.cli.main:main"

# Core owns the third-party dependency lists; the bundle forwards each extra.
[project.optional-dependencies]
dev = ["dblift-core[dev]==4.10.0"]
postgresql = ["dblift-core[postgresql]==4.10.0"]
mysql = ["dblift-core[mysql]==4.10.0"]
mariadb = ["dblift-core[mariadb]==4.10.0"]
oracle = ["dblift-core[oracle]==4.10.0"]
sqlserver = ["dblift-core[sqlserver]==4.10.0"]
db2 = ["dblift-core[db2]==4.10.0"]
duckdb = ["dblift-core[duckdb]==4.10.0"]
cosmosdb = ["dblift-core[cosmosdb]==4.10.0"]
mongodb = ["dblift-core[mongodb]==4.10.0"]
neon = ["dblift-core[neon]==4.10.0"]
supabase = ["dblift-core[supabase]==4.10.0"]
aurora-postgresql = ["dblift-core[aurora-postgresql]==4.10.0"]
alloydb = ["dblift-core[alloydb]==4.10.0"]
yugabytedb = ["dblift-core[yugabytedb]==4.10.0"]
timescaledb = ["dblift-core[timescaledb]==4.10.0"]
citus = ["dblift-core[citus]==4.10.0"]
cockroachdb = ["dblift-core[cockroachdb]==4.10.0"]
redshift = ["dblift-core[redshift]==4.10.0"]
snowflake = ["dblift-core[snowflake]==4.10.0"]
fastapi = ["dblift-core[fastapi]==4.10.0"]
flask = ["dblift-core[flask]==4.10.0"]
django = ["dblift-core[django]==4.10.0"]
otel = ["dblift-core[otel]==4.10.0"]
mcp = ["dblift-core[mcp]==4.10.0"]
all = ["dblift-core[all]==4.10.0"]

[tool.setuptools]
packages = []
