[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dblift-modern-descriptor-fixture"
version = "1.0.0"

[project.entry-points."dblift.providers"]
modern_fixture = "modern_descriptor_provider.plugin:PLUGIN"

[project.entry-points."dblift.provider_descriptors"]
modern_fixture = "modern_descriptor_provider.descriptor:DESCRIPTOR"
