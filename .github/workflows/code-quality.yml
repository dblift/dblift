name: Code Quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Exact tool versions, as in unit-tests.yml: the complexity ceiling compares
      # radon scores for equality, so a radon release must not change the result.
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ".[dev,mcp]"

      - name: Check formatting
        run: black --check --diff dblift/ tests/ scripts/ packages/

      - name: Check imports
        run: isort --check --diff dblift/ tests/ scripts/ packages/

      # tests/ and scripts/ are excluded in .flake8 (legacy volume) — see the
      # note there. Mirrors scripts/check_code_quality.sh.
      - name: Check style
        run: flake8 --config=.flake8 dblift/

      - name: Type check
        run: python -m mypy dblift/ tests/typing/lightweight_extension.py --config-file pyproject.toml --show-error-codes

      - name: Check internal layering
        run: lint-imports --config .importlinter

      - name: AST lint patterns
        run: python scripts/lint_patterns.py

      - name: Public-API docstrings
        run: python scripts/check_api_docstrings.py

      - name: Structural debt (ratchet)
        run: python scripts/check_debt_ratchet.py

      - name: Per-function complexity ceiling
        run: python scripts/check_complexity_ceiling.py

      - name: Check public OSS surface and the MCP stdio round trip
        run: |
          python -m pytest tests/unit/test_oss_public_surface.py \
            tests/smoke/test_oss_standalone.py \
            tests/smoke/test_mcp_stdio.py -q
