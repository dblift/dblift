name: Run Unit Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday 06:00 UTC: run against the newest dependency releases instead of
    # constraints-ci.txt, so a breaking release surfaces here and not on the
    # next unrelated pull request.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Pull requests install the exact versions in constraints-ci.txt; the
      # weekly schedule installs whatever pip resolves today.
      PIP_CONSTRAINT: ${{ github.event_name == 'schedule' && '' || 'constraints-ci.txt' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgresql,mysql,mariadb,oracle,sqlserver,db2,duckdb,cosmosdb,mongodb,django]"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ \
            -n auto \
            --dist=loadscope \
            -p no:benchmark \
            --timeout=120 \
            --cov=api --cov=cli --cov=config --cov=core --cov=db --cov=integrations \
            --cov-report=xml

      - name: Install pytest-dblift
        run: python -m pip install -e packages/pytest-dblift

      - name: Run pytest-dblift tests
        run: |
          python -m pytest packages/pytest-dblift/tests \
            -n auto \
            --dist=loadscope \
            -p no:benchmark \
            --timeout=120

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && github.event_name != 'schedule'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
