name: Run Unit Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday 06:00 UTC: run against the newest dependency releases instead of
    # constraints-ci.txt, so a breaking release surfaces here and not on the
    # next unrelated pull request.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

# Pull requests into develop get the fast loop: one Python version and no
# installed-artifact qualification. Release pull requests into main, pushes to
# main, the weekly schedule and manual runs get every job on both versions.

jobs:
  installed-artifacts:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt
      E4_EVIDENCE_DIR: ${{ github.workspace }}/e4-evidence/${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install artifact test tools
        run: python -m pip install build pytest tomlkit
      - name: Qualify installed wheel, sdist, and additive extensions
        run: |
          set -o pipefail
          mkdir -p "$E4_EVIDENCE_DIR"
          python -m pytest tests/artifacts/ -q 2>&1 | tee "$E4_EVIDENCE_DIR/pytest.log"
      - name: Record tested artifact and evidence hashes
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          directory = Path(os.environ["E4_EVIDENCE_DIR"])
          hashes = {
              str(path.relative_to(directory)): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in directory.rglob("*") if path.is_file()
          }
          (directory / "manifest.json").write_text(
              json.dumps({
                  "source_revision": subprocess.check_output(
                      ["git", "rev-parse", "HEAD"], text=True
                  ).strip(),
                  "python": sys.version,
                  "sha256": hashes,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload installed-artifact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-core-${{ matrix.python-version }}
          path: ${{ env.E4_EVIDENCE_DIR }}

  base-install:
    # The wheel installed with no extras is the lightweight library install:
    # PyYAML and SQLAlchemy only. This job builds the wheel, installs it into a
    # fresh virtual environment (its own pip, never the runner's), and checks
    # that the environment is consistent and the package imports.
    name: base-install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist-base .

      - name: Install the wheel into a fresh virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/base-venv"
          "$RUNNER_TEMP/base-venv/bin/python" -m pip install dist-base/dblift-*.whl

      - name: Base install declares no presentation or analysis dependency
        run: |
          "$RUNNER_TEMP/base-venv/bin/python" -I - <<'PY'
          import re
          from importlib.metadata import requires
          base = sorted(
              re.match(r"[A-Za-z0-9_.-]+", r).group().lower()
              for r in requires("dblift")
              if "extra ==" not in r
          )
          assert base == ["pyyaml", "sqlalchemy"], base
          PY

      - name: pip check
        run: '"$RUNNER_TEMP/base-venv/bin/python" -m pip check'

      - name: Import dblift from the base install
        run: '"$RUNNER_TEMP/base-venv/bin/python" -I -c "import dblift"'

      - name: Import the Python API from the base install
        run: '"$RUNNER_TEMP/base-venv/bin/python" -I -c "from dblift.api import DBLiftClient"'

      - name: Migrate SQLite through the Python API in execution mode
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p base-migrations
          echo "CREATE TABLE t (id INTEGER PRIMARY KEY);" > base-migrations/V1__t.sql
          "$RUNNER_TEMP/base-venv/bin/python" -I - <<'PY'
          from sqlalchemy import create_engine
          from dblift.api import DBLiftClient
          client = DBLiftClient.from_sqlalchemy(
              create_engine("sqlite:///base.db"),
              migrations_dir="base-migrations",
              analysis_mode="execution",
          )
          assert client.migrate().success
          PY

      - name: Run the dblift command from the base install
        run: '"$RUNNER_TEMP/base-venv/bin/dblift" --version'

  sqlglot-newest:
    # The main job installs constraints-ci.txt, which pins sqlglot at the declared
    # minimum, so it runs the statement-facts corpus on that release. This job
    # installs the extras without the constraints file and then the newest
    # sqlglot release the corpus was recorded on
    # (tests/support/facts_corpus/VERSIONS.json).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the newest recorded sqlglot
        run: |
          python -m pip install -e ".[dev,postgresql,mysql,mariadb,oracle,sqlserver,db2,duckdb,cosmosdb,mongodb,django,mcp]"
          NEWEST=$(python -c "import json,pathlib; print(json.loads(pathlib.Path('tests/support/facts_corpus/VERSIONS.json').read_text())['newest'])")
          python -m pip install "sqlglot==$NEWEST"
          python -c "import sqlglot; assert sqlglot.__version__ == '$NEWEST', sqlglot.__version__"

      - name: Run statement-facts tests
        run: |
          python -m pytest tests/unit/core/sql_parser tests/unit/db/plugins/duckdb tests/unit/db/plugins/sqlite \
            -n auto \
            --dist=loadscope \
            -p no:benchmark \
            --timeout=120

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ (github.event_name == 'pull_request' && github.base_ref != 'main') && fromJSON('["3.11"]') || fromJSON('["3.11", "3.12"]') }}
    env:
      # Pull requests install the exact versions in constraints-ci.txt; the
      # weekly schedule installs whatever pip resolves today.
      PIP_CONSTRAINT: ${{ github.event_name == 'schedule' && '' || 'constraints-ci.txt' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgresql,mysql,mariadb,oracle,sqlserver,db2,duckdb,cosmosdb,mongodb,django,mcp]"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ \
            -n auto \
            --dist=loadscope \
            -p no:benchmark \
            --timeout=120 \
            --cov=dblift \
            --cov-report=xml

      - name: Install pytest-dblift
        run: python -m pip install -e packages/pytest-dblift

      - name: Run pytest-dblift tests
        run: |
          python -m pytest packages/pytest-dblift/tests -W error::DeprecationWarning \
            -n auto \
            --dist=loadscope \
            -p no:benchmark \
            --timeout=120

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && github.event_name != 'schedule'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
