name: Upgrade Path

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upgrade-path:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "previous" resolves to the newest release older than this tree.
        # 4.0.0 is the oldest release of the current major.
        old: ["previous", "dblift==4.0.0"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the tree under test
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Resolve the old requirement
        id: old
        run: |
          if [ "${{ matrix.old }}" = "previous" ]; then
            CURRENT="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
            echo "requirement=dblift<${CURRENT}" >> "$GITHUB_OUTPUT"
          else
            echo "requirement=${{ matrix.old }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Old wheel migrates, this tree continues, old wheel reads back
        run: scripts/check_upgrade_path.sh "${{ steps.old.outputs.requirement }}"
