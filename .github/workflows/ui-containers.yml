name: ui-containers

# The scratch test's container strategy against real runtimes: every catalogue engine
# with Docker, PostgreSQL with Podman. The tests download the images they need.
on:
  pull_request:
    paths:
      - "packages/dblift-ui/dblift_ui/containers.py"
      - "packages/dblift-ui/dblift_ui/scratch.py"
      - "packages/dblift-ui/tests/test_scratch_container.py"
      - "packages/dblift-ui/tests/test_containers.py"
      - ".github/workflows/ui-containers.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: docker (${{ matrix.engine }})
    runs-on: ubuntu-latest
    # The SQL Server and Oracle images are large: their download takes most of the time.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Catalogue keys; each is also the name of the dblift extra with its driver.
        engine: [postgresql, mysql, mariadb, sqlserver, oracle]
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt
      DBLIFT_UI_CONTAINER_TESTS: docker
      DBLIFT_UI_CONTAINER_RUNTIME: docker
      DBLIFT_UI_CONTAINER_PULL: "1"
      DBLIFT_UI_CONTAINER_ENGINES: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the server and the engine's driver
        run: python -m pip install -e ".[${{ matrix.engine }}]" -e "packages/dblift-ui[dev]"

      - name: Container tests
        run: |
          set -o pipefail
          python -m pytest packages/dblift-ui/tests/test_scratch_container.py -q -rsp | tee pytest.log

      - name: The engine's real run passed, and was not skipped
        run: grep -E "^PASSED .*::test_a_real_container_runs_the_whole_cycle\[${DBLIFT_UI_CONTAINER_ENGINES}\]$" pytest.log

  podman:
    name: podman (postgresql)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt
      DBLIFT_UI_CONTAINER_TESTS: podman
      DBLIFT_UI_CONTAINER_RUNTIME: podman
      DBLIFT_UI_CONTAINER_PULL: "1"
      DBLIFT_UI_CONTAINER_ENGINES: postgresql
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the server and the engine's driver
        run: python -m pip install -e ".[postgresql]" -e "packages/dblift-ui[dev]"

      - name: Resolve short image names on Docker Hub
        # The catalogue names images as Docker does (postgres:16); Podman needs a search registry for them.
        run: |
          mkdir -p ~/.config/containers
          printf 'unqualified-search-registries = ["docker.io"]\n' > ~/.config/containers/registries.conf
          podman version

      - name: Container tests
        run: |
          set -o pipefail
          python -m pytest packages/dblift-ui/tests/test_scratch_container.py -q -rsp | tee pytest.log

      - name: The engine's real run passed, and was not skipped
        run: grep -E "^PASSED .*::test_a_real_container_runs_the_whole_cycle\[${DBLIFT_UI_CONTAINER_ENGINES}\]$" pytest.log
