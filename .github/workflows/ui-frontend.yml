name: ui-frontend

on:
  pull_request:
    paths:
      - "packages/dblift-ui/**"
      - "dblift/api/**"
      - ".github/workflows/ui-frontend.yml"
  push:
    branches: [main]
    paths:
      - "packages/dblift-ui/**"
      - "dblift/api/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dblift-ui/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24" # jsdom 30 requires Node ^22.22.2 || ^24.15.0 || >=26
          cache: npm
          cache-dependency-path: packages/dblift-ui/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Built interface makes no outbound request
        working-directory: packages/dblift-ui/dblift_ui/static/app
        run: |
          # Hosts allowed to appear as text in the build. None is ever fetched:
          # www.w3.org is the XML/SVG/MathML namespace identifier, reactjs.org
          # is the documentation link inside React's error messages.
          # Any other host (a font, script, style or data host) fails the job.
          allowed='^https?://(www\.w3\.org|reactjs\.org)$'
          unexpected=$(grep -Eoh 'https?://[a-zA-Z0-9.-]+' index.html assets/*.js assets/*.css assets/*.svg \
            | sort -u | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected remote host in the built interface:"
            echo "$unexpected"
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints-ci.txt
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the server
        run: python -m pip install -e . -e "packages/dblift-ui[dev]"

      - uses: actions/setup-node@v7
        with:
          node-version: "24" # jsdom 30 requires Node ^22.22.2 || ^24.15.0 || >=26
          cache: npm
          cache-dependency-path: packages/dblift-ui/frontend/package-lock.json

      - name: Install the interface
        working-directory: packages/dblift-ui/frontend
        run: npm ci

      - name: Build
        working-directory: packages/dblift-ui/frontend
        run: npm run build

      - name: Install the browser
        working-directory: packages/dblift-ui/frontend
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: packages/dblift-ui/frontend
        run: npm run e2e

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/dblift-ui/frontend/test-results/
          retention-days: 7
