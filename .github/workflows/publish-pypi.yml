name: Build OSS release artifacts (publication paused)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate: never publish to PyPI unless the unit suite passes on the released ref.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgresql,mysql,mariadb,oracle,sqlserver,db2,cosmosdb,django]"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ \
            -n auto \
            --dist=loadscope \
            -p no:benchmark \
            --timeout=120

      - name: Install pytest-dblift
        run: python -m pip install -e packages/pytest-dblift

      - name: Run pytest-dblift tests
        run: |
          python -m pytest packages/pytest-dblift/tests \
            -n auto \
            --dist=loadscope \
            -p no:benchmark \
            --timeout=120

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build dblift distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist/dblift

      - name: Build pytest-dblift distributions
        run: python -m build packages/pytest-dblift

      - name: Smoke-test the built pytest-dblift wheel against the built dblift wheel
        # The editable installs in the `test` job never exercise the actual
        # wheel metadata, so a bad floor (like pytest-dblift 0.1.0's
        # `dblift>=3.9`, which let pip pair it with a dblift wheel missing
        # `dblift.api`) reaches PyPI undetected. Install both built wheels
        # into a clean venv and run pytest for real.
        run: |
          python -m venv /tmp/pytest-dblift-smoke-venv
          /tmp/pytest-dblift-smoke-venv/bin/python -m pip install --upgrade pip
          /tmp/pytest-dblift-smoke-venv/bin/python -m pip install dist/dblift/*.whl packages/pytest-dblift/dist/*.whl
          mkdir -p /tmp/pytest-dblift-smoke/migrations
          cat > /tmp/pytest-dblift-smoke/migrations/V1__init.sql <<'EOF'
          create table t (id integer primary key);
          EOF
          cat > /tmp/pytest-dblift-smoke/test_smoke.py <<'EOF'
          def test_dblift_migrates(dblift_migrated_db):
              assert dblift_migrated_db.info().pending_migrations == []
          EOF
          cd /tmp/pytest-dblift-smoke
          /tmp/pytest-dblift-smoke-venv/bin/python -m pytest test_smoke.py

      # Publication remains paused while the 4.11 candidate is qualified.
      - name: Retain built distributions for release qualification
        uses: actions/upload-artifact@v4
        with:
          name: dblift-release-artifacts
          path: |
            dist/dblift/*
            packages/pytest-dblift/dist/*
