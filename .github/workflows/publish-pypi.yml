name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Gate: never publish to PyPI unless the unit suite passes on the released ref.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgresql,mysql,mariadb,oracle,sqlserver,db2,cosmosdb,django]"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ \
            -n auto \
            --dist=loadscope \
            -p no:benchmark \
            --timeout=120

      - name: Install pytest-dblift
        run: python -m pip install -e packages/pytest-dblift

      - name: Run pytest-dblift tests
        run: |
          python -m pytest packages/pytest-dblift/tests \
            -n auto \
            --dist=loadscope \
            -p no:benchmark \
            --timeout=120

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    outputs:
      publish-pytest-dblift: ${{ steps.pytest_dblift_pypi.outputs.publish }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build dblift distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Build pytest-dblift distributions
        run: python -m build packages/pytest-dblift

      - name: Check whether pytest-dblift version is on PyPI
        id: pytest_dblift_pypi
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('packages/pytest-dblift/pyproject.toml','rb'))['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          set +e
          CODE=$(curl -sS -o /tmp/pypi-pytest-dblift.json -w "%{http_code}" \
            "https://pypi.org/pypi/pytest-dblift/${VERSION}/json")
          CURL_STATUS=$?
          set -e
          if [ "$CURL_STATUS" -ne 0 ]; then
            echo "PyPI lookup failed (curl exit ${CURL_STATUS})"
            exit 1
          fi
          echo "PyPI HTTP ${CODE} for pytest-dblift==${VERSION}"
          if [ "$CODE" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected PyPI status ${CODE}"
            cat /tmp/pypi-pytest-dblift.json || true
            exit 1
          fi

      - name: Publish dblift
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Upload pytest-dblift distributions
        if: steps.pytest_dblift_pypi.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-dblift-dist
          path: packages/pytest-dblift/dist

  publish-pytest-dblift:
    needs: publish
    if: needs.publish.outputs.publish-pytest-dblift == 'true'
    runs-on: ubuntu-latest
    # Separate environment from the dblift publish job: PyPI trusted-publisher
    # claims (repo + workflow + environment) must be unique per project, or it
    # mints a token scoped to the wrong project.
    environment: pypi-pytest-dblift

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pytest-dblift-dist
          path: packages/pytest-dblift/dist

      - name: Publish pytest-dblift
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/pytest-dblift/dist
