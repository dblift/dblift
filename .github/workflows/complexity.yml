name: Complexity

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  complexity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install complexity tools
        run: python -m pip install --upgrade pip radon xenon

      - name: Report complexity
        run: radon cc dblift/ -s -a

      # --max-absolute F never fails on a block: F is radon's worst rank, so no
      # single function can exceed it. This step only bounds each module's
      # average-complexity rank (E) and the overall average (B). Per-function
      # limits are enforced by scripts/check_complexity_ceiling.py in the Code
      # Quality workflow.
      - name: Enforce complexity ceiling
        run: xenon --max-absolute F --max-modules E --max-average B dblift/
