name: Complexity

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  complexity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install complexity tools
        run: python -m pip install --upgrade pip radon xenon

      - name: Report complexity
        run: radon cc dblift/ -s -a

      # Backstop, not a target: only an F-ranked block fails the build. This is
      # the strictest threshold the tree passes today (-bE would flag 21 blocks),
      # so it catches new extremes without blocking on existing debt. Tighten a
      # rank at a time as the hotspots are split.
      - name: Enforce complexity ceiling
        run: xenon --max-absolute F --max-modules E --max-average B dblift/
