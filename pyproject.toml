# PR-H6: strict core/migration leaf modules — snapshot, state, scripting,
# sql, rules, and placeholders sub-packages. Fixes were mechanical:
# ``migration: Any`` annotations on duck-typed helper parameters, generic
# parameters on ``List[Dict[str, Any]]`` / ``Dict[str, Any]``, ``Optional``
# wrappers on default-``None`` params, return-type annotations on two
# ``SqlAnalyzer`` methods, and explicit ``-> None`` / ``-> str`` on inner
# functions. Same flag set as the api/* carve-outs above.
[[tool.mypy.overrides]]
module = [
    "dblift.core.migration.state",
    "dblift.core.migration.state.migration_data_service",
    "dblift.core.migration.state.migration_display_state",
    "dblift.core.migration.state.migration_state",
    "dblift.core.migration.state.migration_state_manager",
    "dblift.core.migration.state.migration_state_service",
    "dblift.core.migration.scripting",
    "dblift.core.migration.scripting.migration_script_manager",
