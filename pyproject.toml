# PR-H5: strict core/migration executor + commands — 7 modules spanning
# the migration execution engine and the command layer.  Fixes included
# stale ``# type: ignore`` comments removed and
# ``_parse_sql_statements`` ``placeholder_service`` param annotated as
# ``Optional[PlaceholderService]``, bare ``List`` → ``List[Migration]``
# on six private helpers, untyped ``ctx_or_config`` / ``journal`` /
# ``placeholder_service`` params in ``DiffCommand`` / ``MigrateCommand``
# typed as ``Optional[Union[BaseCommandContext, DbliftConfig]]`` / the
# appropriate TYPE_CHECKING-guarded types, ``_migration_type_name``
# annotated as ``(object) -> str``, ``_seen_versions: dict`` →
# ``Dict[str, str]``, and ``SchemaSnapshotService.load_latest_snapshot``
# given ``-> Optional[SchemaSnapshot]`` which made a downstream
# ``cast(SchemaSnapshotPayload, ...)`` in ``export_schema_command``
# redundant and removable.  Same flag set as the api/* carve-outs above.
[[tool.mypy.overrides]]
module = [
    "dblift.core.migration.executor.execution_engine",
    "dblift.core.migration.commands.baseline_command",
    "dblift.core.migration.commands.import_flyway_command",
    "dblift.core.migration.commands.info_command",
    "dblift.core.migration.commands.migrate_command",
    "dblift.core.migration.commands.undo_command",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true

# PR-H7a: strict db/introspection — dialect introspectors, all extractors,
# and small leaf files.  Key fixes: ``__init__`` / ``__exit__`` / abstract
# method signatures annotated with ``Any``-typed params and explicit return
# types; bare ``List`` / ``Dict`` / ``frozenset`` literals replaced by their
# generic forms; ``SchemaIntrospector(...)`` call sites typed as
# ``temp_introspector: Any = SchemaIntrospector(...)  # type: ignore[no-untyped-call]``
# with ``# type: ignore[no-any-return]`` on the corresponding ``return``
# statements (SchemaIntrospector is not yet in the strict zone); stale
# ``# type: ignore`` comments removed where the underlying type is now
# ``Any``; ``self.connection: Any`` and ``self.metadata: Any`` added to
# ``BaseIntrospector``; ``_should_preload_materialized_views`` wrapped in
# ``bool(...)`` to fix ``Literal[False] | Any | None`` → ``bool`` mismatch.
# Same flag set as the api/* carve-outs above.
[[tool.mypy.overrides]]
module = [
    "dblift.core.introspection.result",
    "dblift.core.introspection._partition_enricher",
    "dblift.core.introspection._column_enricher",
    "dblift.core.introspection._vendor_property_applier",
    "dblift.core.introspection.vendor_queries_factory",
    "dblift.core.introspection.introspector_factory",
    "dblift.core.introspection.base_introspector",
    "dblift.core.introspection.extractors.base_extractor",
    "dblift.core.introspection.extractors.column_extractor",
    "dblift.core.introspection.extractors.constraint_extractor",
    "dblift.core.introspection.extractors.index_extractor",
    "dblift.core.introspection.extractors.misc_extractor",
    "dblift.core.introspection.extractors.procedure_extractor",
    "dblift.core.introspection.extractors.table_extractor",
    "dblift.core.introspection.extractors.trigger_extractor",
