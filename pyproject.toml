[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dblift"
version = "4.0.0"
description = "Flyway-style raw-SQL migrations for Python teams. No JVM, and you see the exact SQL before it runs."
keywords = ["flyway", "migrations", "python", "sql", "postgresql", "mysql"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.1",
    "tabulate>=0.9.0",
    "python-dateutil>=2.8.2",
    "typing-extensions>=4.7.1",
    "click>=8.1.7",
    "rich>=13.3.0",
    "Jinja2>=3.1.0",
    "sqlglot>=30.0.0,<31",
    "packaging>=23.0",
    # Security floor: Python 3.11 minimum (see CHANGELOG).
    "SQLAlchemy>=2.0.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
dblift = "dblift.cli.main:main"

# Epic 26 story 26-12: dialect plugin discovery via entry-points.
# First-party plugins ship inside the wheel under db/plugins/<X>/;
# third parties install their own package and register through this
# same group. ``ProviderRegistry.discover_plugins`` reads them via
# ``importlib.metadata.entry_points``.
[project.entry-points."dblift.providers"]
postgresql = "dblift.db.plugins.postgresql.plugin:PLUGIN"
mysql = "dblift.db.plugins.mysql.plugin:PLUGIN"
mariadb = "dblift.db.plugins.mariadb.plugin:PLUGIN"
oracle = "dblift.db.plugins.oracle.plugin:PLUGIN"
sqlserver = "dblift.db.plugins.sqlserver.plugin:PLUGIN"
db2 = "dblift.db.plugins.db2.plugin:PLUGIN"
sqlite = "dblift.db.plugins.sqlite.plugin:PLUGIN"
cosmosdb = "dblift.db.plugins.cosmosdb.plugin:PLUGIN"
mongodb = "dblift.db.plugins.mongodb.plugin:PLUGIN"
duckdb = "dblift.db.plugins.duckdb.plugin:PLUGIN"
# PostgreSQL-compatible distributions — reuse the PostgreSQL provider/config/
# driver, distinct identity only. Users keep their postgresql:// URL and select
# via `type: <name>`.
neon = "dblift.db.plugins.neon.plugin:PLUGIN"
supabase = "dblift.db.plugins.supabase.plugin:PLUGIN"
aurora-postgresql = "dblift.db.plugins.aurora_postgresql.plugin:PLUGIN"
alloydb = "dblift.db.plugins.alloydb.plugin:PLUGIN"
yugabytedb = "dblift.db.plugins.yugabytedb.plugin:PLUGIN"
timescaledb = "dblift.db.plugins.timescaledb.plugin:PLUGIN"
citus = "dblift.db.plugins.citus.plugin:PLUGIN"
cockroachdb = "dblift.db.plugins.cockroachdb.plugin:PLUGIN"
redshift = "dblift.db.plugins.redshift.plugin:PLUGIN"
snowflake = "dblift.db.plugins.snowflake.plugin:PLUGIN"

# CLI command parser extensions (third-party packages can add subcommands
# by loading a function that receives the top-level ArgumentParser).
[project.entry-points."dblift.commands"]

# Command handler functions (return dict of name -> handler). Used for
# the core dispatch of most commands.
[project.entry-points."dblift.command_handlers"]

# Terminal / takeover commands (full process control, return int exit code).
[project.entry-points."dblift.terminal_commands"]

# Neutral feature / entitlement registration point. Empty in pure OSS.
[project.entry-points."dblift.features"]

# Extension seams discovered at runtime. OSS declares the groups empty.
[project.entry-points."dblift.differ"]

[project.entry-points."dblift.event_listeners"]

[project.entry-points."dblift.introspection"]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.3.1",
    "pytest-timeout>=2.2.0",
    "pytest-html>=4.0.0",
    "pytest-metadata>=3.0.0",
    "pytest-benchmark>=4.0.0",
    "coverage>=7.3.0",
    "black>=26.1.0",
    "mypy>=1.3.0",
    "flake8>=6.1.0",
    "flake8-tidy-imports>=4.12.0",
    "isort>=5.12.0",
    "import-linter>=2.0",
    "docker>=6.1.2",
    "types-PyYAML>=6.0.12.12",
    "types-setuptools",
    "pre-commit>=4.0.0",
    "Cython>=3.0.0",
    # Security and quality tooling (see .github/workflows/security.yml,
    # complexity.yml). Versions floored at known-good releases.
    # setuptools floored at 83.0.0 to clear PYSEC-2026-3447 (pip-audit gate):
    # earlier releases ship in the build/runtime env and fail the audit.
    "setuptools>=83.0.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
    "radon>=6.0.1",
    "xenon>=0.9.1",
    "opentelemetry-sdk>=1.20",
    "Django>=4.2",
    "psycopg[binary]>=3.1",
]
postgresql = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
mariadb = ["PyMySQL>=1.1"]
oracle = ["oracledb>=2.0"]
sqlserver = ["pymssql>=2.3"]
db2 = ["ibm_db>=3.2", "ibm_db_sa>=0.4"]
duckdb = ["duckdb>=1.0", "duckdb_engine>=0.13"]
# Cosmos DB talks to the account plane through the Azure SDK, not a DBAPI
# driver. It is an optional extra like every other engine's driver: a bare
# ``pip install dblift`` must not pull one engine's SDK for all 19 dialects.
# Every ``azure`` import in the tree is function-local or TYPE_CHECKING-guarded
# except ``db/plugins/cosmosdb/cosmosdb/_sdk.py``, which is itself imported
# lazily — so plugin discovery still registers cosmosdb without the SDK.
cosmosdb = ["azure-cosmos>=4.5.0", "azure-identity>=1.15.0"]
# ``pymongo`` is imported lazily by the plugin's ``_sdk.py`` and
# ``connection_manager.py``, so plugin discovery still registers mongodb
# without the driver installed.
mongodb = ["pymongo>=4.6"]
# PostgreSQL-compatible distributions share the psycopg driver.
neon = ["psycopg[binary]>=3.1"]
supabase = ["psycopg[binary]>=3.1"]
aurora-postgresql = ["psycopg[binary]>=3.1"]
alloydb = ["psycopg[binary]>=3.1"]
yugabytedb = ["psycopg[binary]>=3.1"]
timescaledb = ["psycopg[binary]>=3.1"]
citus = ["psycopg[binary]>=3.1"]
cockroachdb = ["psycopg[binary]>=3.1"]
redshift = ["sqlalchemy-redshift>=1.0.0", "redshift-connector>=2.1.0"]
snowflake = ["snowflake-sqlalchemy>=1.11.0"]
fastapi = ["fastapi>=0.100"]
flask = ["flask>=2.3"]
django = ["Django>=4.2"]
otel = ["opentelemetry-api>=1.20"]
# ``all`` must name *every* engine extra, not a hand-picked subset: users read
# it as "whatever dblift can talk to". Enforced by
# ``tests/unit/test_oss_public_surface.py::
# test_all_extra_covers_every_engine_extra``, which derives the engine set from
# this table (everything except dev / django / flask / fastapi / otel / all) and
# fails if a new engine extra is added without being listed here.
#
# The PostgreSQL-compatible distributions are named explicitly even though they
# all resolve to the same ``psycopg[binary]`` as ``postgresql`` today. Relying
# on that equivalence would make ``all`` silently wrong the day one of them
# needs its own package (as redshift and snowflake already do); naming them
# keeps the coverage claim mechanically checkable instead of argued.
all = [
    "dblift[postgresql,mysql,mariadb,oracle,sqlserver,db2,duckdb,cosmosdb,mongodb]",
    "dblift[redshift,snowflake]",
    "dblift[neon,supabase,aurora-postgresql,alloydb]",
    "dblift[yugabytedb,timescaledb,citus,cockroachdb]",
]

[tool.setuptools]
# Use find directive to automatically discover all packages
# Exclude non-package directories that setuptools might mistake for packages
[tool.setuptools.packages.find]
include = ["dblift*"]
exclude = ["tests*", "demo*", "scripts*", "docs*", "example*", "logo*", "site*"]

[tool.setuptools.package-data]
# PEP 561: ship ``dblift/api/py.typed`` so downstream type checkers pick up
# the public API's type annotations. See docs/semver-policy.md.
"dblift.api" = ["py.typed"]
"dblift.core.logger" = ["templates/*.html"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["dblift"]

[tool.mypy]
# Lowest supported Python version; mypy type-checks against this version.
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

# For now, don't enforce complete typing everywhere to allow gradual adoption
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

# Allow Any types to facilitate adoption
disallow_any_expr = false
disallow_any_generics = false
disallow_subclassing_any = false

# Enable implicit Optional for compatibility with existing code
no_implicit_optional = false

# Always ignore missing imports
ignore_missing_imports = true

# Don't warn about unused type: ignore comments during gradual typing adoption
warn_unused_ignores = false

# Required to find modules correctly
namespace_packages = true
explicit_package_bases = true

# Show error codes for easier filtering
show_error_codes = true
pretty = true

# Skip these directories/files
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
    "tests",
]

# More detailed reports
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true

disable_error_code = ["unreachable"]

# ---------------------------------------------------------------------------
# Per-module STRICT zone (PR-E4).
#
# Modules listed below are type-checked under mypy ``--strict`` (every flag
# the CLI ``--strict`` switch turns on). The intent is to grow this list one
# module at a time so new code lands in the strict zone by default and old
# code is migrated incrementally.
#
# To add a module:
#   1. Run ``mypy --strict <module>`` and confirm 0 errors *in that file*
#      (cascaded errors from imports stay in the lax baseline — that's fine).
#   2. Add it to the ``module = [...]`` list below.
#   3. Run ``mypy --config-file pyproject.toml api/ cli/ config/ core/ db/``
#      end-to-end and confirm 0 errors.
#
# Strict flags mirror what the CLI ``--strict`` switch enables; keeping them
# explicit here makes the contract diff-able when mypy adds new strict
# defaults in future releases.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = [
    "dblift.api.__init__",
    "dblift.api._client_factory",
    "dblift.api.events",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true

# PR-F1: extend the strict zone to the rest of ``api/``. Same flag set as
# above except ``no_implicit_reexport`` — enforcing it on these two
# modules would require touching ``core.logger.results`` to add explicit
# ``__all__`` re-exports, which
# is scope creep beyond the ``api/`` package. When Phase F+ extends the
# strict zone into ``core/``, those re-exports become a one-shot fix and
# this carve-out can be removed.
[[tool.mypy.overrides]]
module = [
    "dblift.api._client_operations",
    "dblift.api.client",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true

# PR-G1: first wave of strict expansion into ``core/`` — leaf modules with
# one or zero ``--strict`` errors that can be cleared with a single-line
# annotation fix. Same flag set as the api/* carve-out above (sans
# ``no_implicit_reexport`` for the same reason).
[[tool.mypy.overrides]]
module = [
    "dblift.core.logger._factory",
    "dblift.core.logger._levels",
    "dblift.core.logger._null",
    "dblift.core.logger.formatters.factory",
    "dblift.core.migration.executor.migration_helpers",
    "dblift.core.migration.executor.placeholder_manager",
    "dblift.core.migration.executor.transaction_policy",
    "dblift.core.migration.commands.validate_command",

    "dblift.core.migration.scripting.undo_script_generator._extractors",
    "dblift.core.migration.scripting.undo_script_generator._helpers",
    "dblift.core.migration.rules.migration_rules",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true

# PR-G2: second wave of strict expansion — sql_parser / sql_generator /
# sql_validator leaves, normalization, and two cli/handlers leaves.
# Same flag set as the api/* carve-outs above.
[[tool.mypy.overrides]]
module = [
    "dblift.core.sql_parser.hybrid_parser",
    "dblift.core.sql_parser.enhanced_regex_parser",
    "dblift.core.sql_parser.unified_regex_parser",
    "dblift.core.sql_generator.formatter",
    "dblift.core.sql_generator.sql_generator",
    "dblift.core.normalization",
    "dblift.core.sql_model.view_options",
    "dblift.cli.handlers._shared",
    "dblift.cli.handlers.info",
    "dblift.cli._command_handlers",
    "dblift.cli.db_utils",
    "dblift.cli._parser_setup",
    "dblift.cli._config_helpers",
    "dblift.cli.main",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true

# PR-H1: strict boundary protocols — Type safety 7→8 lifts the
# framework's contract layer (dialect_boundary Protocols, BaseQuirks,
# BaseProvider, ProviderRegistry, sql_model.dialect) plus the plugin
# introspector __init__.py shims that load each plugin's vendor
# introspector lazily. Same flag set as the api/* carve-outs above.
[[tool.mypy.overrides]]
module = [
    "dblift.core.dialect_boundary",
    "dblift.core.sql_model.dialect",
    "dblift.core.sql_model.feature_gates",
    "dblift.core.sql_model.server_info",
    "dblift.db.base_quirks",
    "dblift.db.base_provider",
    "dblift.db.feature_gate",
    "dblift.db.provider_registry",
    "dblift.db.plugins.cosmosdb.introspection",
    "dblift.db.plugins.db2.introspection",
    "dblift.db.plugins.mysql.introspection",
    "dblift.db.plugins.oracle.introspection",
    "dblift.db.plugins.postgresql.introspection",
    "dblift.db.plugins.sqlite.introspection",
    "dblift.db.plugins.sqlserver.introspection",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true

# PR-H2: strict core/sql_model — all 22 modules in core/sql_model/.
# Most were already strict-clean; only constraint_validator (9 errors:
# missing `table: "Table"` annotations on 7 validator methods, one
# unused type-ignore, one untyped frozenset) and table.py (5 errors:
# Optional[List] → Optional[List["Partition"]], untyped
# `_filegroup_supported` inner def, two unused type-ignores) needed
# fixes. Same flag set as the api/* carve-outs above.
[[tool.mypy.overrides]]
module = [
    "dblift.core.sql_model",
    "dblift.core.sql_model._base_parse_result",
    "dblift.core.sql_model._base_sql_column",
    "dblift.core.sql_model._base_sql_constraint",
    "dblift.core.sql_model._base_sql_object",
    "dblift.core.sql_model._base_sql_statement",
    "dblift.core.sql_model.base",
    "dblift.core.sql_model.constraint_validator",
    "dblift.core.sql_model.database_link",
    "dblift.core.sql_model.event",
    "dblift.core.sql_model.extension",
    "dblift.core.sql_model.foreign_data_wrapper",
    "dblift.core.sql_model.foreign_server",
    "dblift.core.sql_model.index",
    "dblift.core.sql_model.linked_server",
    "dblift.core.sql_model.module",
    "dblift.core.sql_model.package",
    "dblift.core.sql_model.partition",
    "dblift.core.sql_model.procedure",
    "dblift.core.sql_model.sequence",
    "dblift.core.sql_model.synonym",
    "dblift.core.sql_model.table",
    "dblift.core.sql_model.table_canonicalizer",
    "dblift.core.sql_model.table_options",
    "dblift.core.sql_model.trigger",
    "dblift.core.sql_model.user_defined_type",
    "dblift.core.sql_model.view",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true

# PR-H3: strict db/ error model.
[[tool.mypy.overrides]]
module = [
    "dblift.db.error",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
